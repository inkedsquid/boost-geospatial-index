name: Prebuild Native Modules

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]

jobs:
  prebuild:
    name: Prebuild on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-13, macos-latest]
        arch: x64
        include:
          # macOS Apple Silicon (arm64)
          - os: macos-latest
            arch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build prebuilds (Windows/Linux)
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'windows-latest'
        run: npm run build -- --arch=x64

      - name: Build prebuilds (macOS)
        if: startsWith(matrix.os, 'macos')
        run: npm run build -- --arch=${{ matrix.arch }}

      - name: List prebuilds
        run: |
          echo "Generated prebuilds:"
          find prebuilds -name "*.node" -type f || echo "No prebuilds found"
        shell: bash
