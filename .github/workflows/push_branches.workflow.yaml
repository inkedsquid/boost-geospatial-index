name: Push checks

on:
  push:
    branches:
      - master
      - beta
      - 1-dev

jobs:
  prebuild:
    name: Prebuild on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-13, macos-latest]
        include:
          - os: ubuntu-22.04
            arch: x64
          # - os: windows-latest
          #   arch: x64
          # macOS Intel (x64)
          - os: macos-13
            arch: x64
          # macOS Apple Silicon (arm64)
          - os: macos-latest
            arch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build prebuilds (Windows/Linux)
        if: matrix.os == 'ubuntu-22.04' || matrix.os == 'windows-latest'
        run: npm run build -- --arch=x64

      - name: Build prebuilds (macOS)
        if: startsWith(matrix.os, 'macos')
        run: npm run build -- --arch=${{ matrix.arch }}

      - name: List prebuilds
        run: |
          echo "Generated prebuilds:"
          find prebuilds -name "*.node" -type f || echo "No prebuilds found"
        shell: bash

      - name: Upload prebuilds
        uses: actions/upload-artifact@v4
        with:
          name: prebuilds-${{ matrix.os }}-${{ matrix.arch }}
          path: prebuilds/
          retention-days: 1

  release:
    needs: prebuild
    name: Release process
    runs-on: ubuntu-22.04
    steps:
      - name: Download all prebuilds
        uses: actions/download-artifact@v4
        with:
          pattern: prebuilds-*
          path: prebuilds/
          merge-multiple: true
          run-id: ${{ github.run_id }}

      - name: List downloaded prebuilds
        run: |
          echo "Downloaded prebuilds:"
          find prebuilds -name "*.node" -type f -exec ls -la {} \; || echo "No prebuilds found"
          echo "Directory structure:"
          tree prebuilds/ || find prebuilds -type f
        shell: bash

      - name: List directory
        run: |
          echo "Directory structure:"
          tree .
        shell: bash

      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"
          scope: "@kuzzleio"

      - name: Install dependencies
        run: npm ci

      - name: Package with npm
        run: npm pack

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: "*.tgz"
          retention-days: 30

      # - name: Release
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.SEMANTIC_RELEASE_GHP }}
      #     NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
